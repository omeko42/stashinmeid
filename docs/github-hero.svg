      <circle cx="462" cy="116" r="9" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="479" y="112" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600">Struk AI · Kopi</text>
