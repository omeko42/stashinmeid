<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="StashinMe — Personal &amp; Collaborative Finance Workspace Preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0f"/>
      <stop offset="55%" stop-color="#0c131a"/>
      <stop offset="100%" stop-color="#071612"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
