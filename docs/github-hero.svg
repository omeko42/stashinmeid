      <circle cx="462" cy="168" r="9" fill="#a855f7" fill-opacity="0.2"/>
      <text x="479" y="164" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600">Grup Tim Proyek</text>
      <text x="479" y="179" fill="#c084fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">-Rp 1.250.000 · 4 org</text>

