    <text x="0" y="122" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="500">Personal &amp; Collaborative Finance</text>
    <text x="0" y="146" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="500">Workspace — Multi-Space, Multi-Currency</text>

