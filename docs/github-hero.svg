      <text x="236" y="208" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Sep</text>
      <text x="308" y="208" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Okt</text>
